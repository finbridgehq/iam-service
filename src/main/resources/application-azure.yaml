# Perfil para Azure Container Apps (Sprint 2). Parte del mismo código que `docker`,
# pero sin los vecinos del Compose: no hay Eureka, la base de datos es un Azure
# Database for PostgreSQL y el broker de eventos es Azure Event Hubs, que habla el
# protocolo de Kafka. Todo valor sensible llega por variable de entorno desde los
# secrets de la Container App.
server:
  port: 8081

spring:
  jpa:
    hibernate:
      # PARCHE TEMPORAL: el proyecto no tiene Flyway ni Liquibase, así que nada crea
      # el esquema en una base vacía. Con `validate` (perfil prod) el primer arranque
      # falla. Volver a `validate` cuando existan migraciones versionadas.
      ddl-auto: update
  datasource:
    url: jdbc:postgresql://${IAM_DB_HOST}:${IAM_DB_PORT:5432}/${IAM_DB_NAME}?sslmode=${IAM_DB_SSLMODE:require}
    username: ${IAM_DB_USERNAME}
    password: ${IAM_DB_PASSWORD}
  mail:
    # Sin proveedor de correo todavía: las variables quedan definidas pero vacías.
    # Recuperar contraseña responde 202 igual; el envío falla y se registra en el log
    # (PasswordResetRequestedEventHandler lo captura). Rellenar cuando se elija SMTP.
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
  cloud:
    stream:
      kafka:
        binder:
          # <namespace>.servicebus.windows.net:9093, desde la capa messaging de vankoo-infra.
          brokers: ${KAFKA_BROKERS:}
          # Event Hubs no deja crear topics desde los clientes: los crea Terraform.
          auto-create-topics: false
          # Valen para el productor y para cualquier consumidor futuro.
          configuration:
            security.protocol: SASL_SSL
            sasl.mechanism: PLAIN
            # Usuario literal $ConnectionString; contraseña, la cadena de conexión de la
            # regla de acceso de IAM (secret kafka-connection-string).
            sasl.jaas.config: org.apache.kafka.common.security.plain.PlainLoginModule required username="${KAFKA_SASL_USERNAME:$ConnectionString}" password="${KAFKA_SASL_PASSWORD:}";
            # Valores que pide Event Hubs: corta las conexiones inactivas a los 240 s
            # y exige al menos 60 s de timeout para el productor idempotente.
            request.timeout.ms: 60000
            metadata.max.age.ms: 180000
            connections.max.idle.ms: 180000
          producer-properties:
            acks: all
            enable.idempotence: true
            # Event Hubs cierra la conexión si un envío supera 1 046 528 bytes.
            max.request.size: 1000000
      bindings:
        iam-out-0:
          destination: vankoo.iam.events
          content-type: application/json

# Publica en Event Hubs solo cuando la Container App trae KAFKA_ENABLED=true (y con
# ello la dirección y la clave). Sin esa variable sigue LoggingEventService, que
# descarta los eventos en el log, como antes de existir el broker.
vankoo:
  events:
    enabled: ${KAFKA_ENABLED:false}

# No hay discovery server en Azure: el gateway resuelve por el DNS interno del
# Container Apps Environment. Sin esto el cliente de Eureka reintenta registrarse
# contra un host inexistente y llena el log.
eureka:
  client:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        # Solo lo que necesita el probe de la Container App. El resto (env, heapdump,
        # loggers) es público en WebSecurityConfiguration y no debe salir a internet.
        include: health,info
  health:
    # Con Event Hubs, el indicador del binder de Kafka entra en /actuator/health; sin
    # broker marcaría el servicio como DOWN, así que va con el mismo interruptor.
    binders:
      enabled: ${KAFKA_ENABLED:false}
    # PARCHE TEMPORAL: sin SMTP configurado el indicador de correo pone /actuator/health
    # en DOWN. Volver a habilitarlo cuando se rellenen las variables MAIL_*.
    mail:
      enabled: false
  endpoint:
    health:
      probes:
        enabled: true

documentation:
  local-url: https://${IAM_PUBLIC_HOST}
  gateway-url: https://${IAM_GATEWAY_HOST}/iam

logging:
  level:
    org.hibernate.SQL: error

mail:
  password-reset:
    web-url: ${PASSWORD_RESET_WEB_URL}
    mobile-url: ${PASSWORD_RESET_MOBILE_URL:vankoo://reset-password}
